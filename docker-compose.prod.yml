# =============================================================================
# Producción de DiagnosTICo · https://diagnostico.captter.com
#
# Apache del servidor tiene el SSL y reenvía a 127.0.0.1:8200 (NGINX_PORT).
# Solo Nginx publica un puerto, y solo en 127.0.0.1: PostgreSQL y Redis
# quedan dentro de la red de Docker.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Pasos completos (primer despliegue y actualizaciones): docs/20_DESPLIEGUE.md.
# Las variables salen del archivo .env del servidor (plantilla:
# .env.production.example). El .env nunca se sube al repositorio.
# =============================================================================

name: diagnostico

x-aplicacion: &aplicacion
    image: diagnostico-app:latest
    env_file: .env
    restart: unless-stopped
    volumes:
        # PDF, logos, fotos y logs sobreviven a una imagen nueva.
        - storage:/var/www/html/storage
    networks:
        - interna
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    app:
        <<: *aplicacion
        build:
            context: .
            dockerfile: docker/php/Dockerfile.prod
            args:
                VITE_APP_NAME: '${APP_NAME:-Captter}'
        healthcheck:
            test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);"']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s

    # Trabajador de la cola: análisis de la IA, PDF y correos.
    queue:
        <<: *aplicacion
        command: ['php', 'artisan', 'queue:work', '--sleep=1', '--tries=3', '--timeout=120', '--max-time=3600']
        stop_grace_period: 130s
        depends_on:
            app:
                condition: service_healthy

    # Tareas programadas (routes/console.php): mediciones vencidas cada hora,
    # cuentas por borrar a las 03:10 y el resumen de los lunes.
    scheduler:
        <<: *aplicacion
        command: ['php', 'artisan', 'schedule:work']
        depends_on:
            app:
                condition: service_healthy

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile.prod
            additional_contexts:
                app: 'service:app'
        image: diagnostico-nginx:latest
        restart: unless-stopped
        ports:
            - '127.0.0.1:${NGINX_PORT:-8200}:80'
        networks:
            - interna
        depends_on:
            app:
                condition: service_healthy

    postgres:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-diagnostico}'
            POSTGRES_USER: '${DB_USERNAME:-diagnostico}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?Falta DB_PASSWORD en el .env}'
        volumes:
            - postgres:/var/lib/postgresql
        networks:
            - interna
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -q -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"']
            interval: 10s
            timeout: 5s
            retries: 5

    # Caché y cola. Las sesiones siguen en PostgreSQL: el sistema borra las
    # sesiones de una cuenta al desactivarla o cambiarle el rol.
    redis:
        image: 'redis:8-alpine'
        restart: unless-stopped
        command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD:?Falta REDIS_PASSWORD en el .env}'
        volumes:
            - redis:/data
        networks:
            - interna
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    interna:
        driver: bridge

volumes:
    storage:
    postgres:
    redis:
