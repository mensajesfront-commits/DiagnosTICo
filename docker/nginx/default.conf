# Sitio de DiagnosTICo (docker/nginx/Dockerfile.prod).
# Apache del servidor recibe https://diagnostico.captter.com con el SSL y
# reenvía a 127.0.0.1:8200, que es este Nginx (puerto 80 del contenedor).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # La foto o el logo pesan hasta 2 MB (A6, E11).
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos de Vite con hash en el nombre: se guardan un año en el navegador.
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        # Un PDF se genera en el momento si aún no existe: puede tardar.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Ningún otro .php se ejecuta.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
