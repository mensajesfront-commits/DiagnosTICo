# Nginx de producción (target "web" de docker/php/Dockerfile.prod).
# Escucha solo dentro de Docker; el proxy del servidor (Apache o Nginx) pone
# HTTPS y le pasa X-Forwarded-*, que Laravel acepta (trustProxies en bootstrap/app.php).
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Assets de Vite (con hash en el nombre): caché larga
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Disco "public" de Laravel (php artisan storage:link)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        # Resuelve "app" en cada petición: si el contenedor se recrea, sigue funcionando.
        resolver 127.0.0.11 valid=10s;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        internal;
    }

    # Ningún otro .php se ejecuta
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
