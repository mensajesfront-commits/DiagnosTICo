; PHP de producción (docker/php/Dockerfile.prod)

[PHP]
expose_php          = Off
upload_max_filesize = 20M
post_max_size       = 20M
; El análisis de la IA y los PDF corren en la cola; las peticiones web son cortas.
max_execution_time  = 120
memory_limit        = 256M
; Laravel usa la zona de config/app.php (UTC); cada empresa tiene la suya en Mi perfil.
date.timezone       = UTC
