; PHP de producción (docker/php/Dockerfile.prod).
expose_php = Off
memory_limit = 256M
max_execution_time = 120
; La foto o el logo (A6, E11) se aceptan hasta 2 MB; se deja margen.
upload_max_filesize = 10M
post_max_size = 12M
date.timezone = UTC
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro del contenedor: se reconstruye la imagen.
opcache.validate_timestamps = 0
