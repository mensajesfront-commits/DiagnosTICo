; Ajustes del pool de php-fpm (docker/php/Dockerfile.prod).
[www]
; Las variables del .env llegan como variables del contenedor (env_file).
; Sin esto php-fpm las borra y Laravel no las ve; también hace falta el PATH
; para que Browsershot encuentre node al generar un PDF desde la web.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 130s
catch_workers_output = yes
decorate_workers_output = no
