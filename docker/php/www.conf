; Pool de PHP-FPM de producción (se suma al www.conf de la imagen base).
[www]
user  = www-data
group = www-data

pm = dynamic
pm.max_children      = 12
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; Las variables del env_file también llegan a PHP-FPM (por si se limpia la caché de config).
clear_env = no
